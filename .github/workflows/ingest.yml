name: CDSCO ingest

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdsco-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Commit alert diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/alerts.json is the source snapshot. The site fetches a compact
          # copy that Vite writes to public/data at build time (gitignored).
          git add data/alerts.json data/diff-latest.json
          if git diff --cached --quiet; then
            echo "No CDSCO diff to commit."
          else
            git commit -m "chore: update CDSCO alert snapshot"
            git push
          fi
